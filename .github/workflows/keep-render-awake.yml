name: Keep Render Awake

on:
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render static asset
        run: |
          set -e
          URL="https://placement-predict-0vnt.onrender.com/static/css/theme.css"
          echo "Pinging $URL"
          curl --fail --silent --show-error --location --max-time 90 \
            --retry 2 --retry-delay 5 \
            --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$URL"
