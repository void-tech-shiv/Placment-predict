<div class="glass-panel admin-card"><div class="admin-card-head"><div><small>ACCESS CONTROL</small><h3>User management</h3></div><span class="admin-pill">{{ users|length }} accounts</span></div><div class="table-responsive"><table class="table admin-table align-middle"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Created</th><th>Last login</th><th class="text-end">Controls</th></tr></thead><tbody>{% for u in users %}<tr><td><strong>{{ u.name }}</strong><small>{{ u.email }}</small></td><td><span class="admin-pill">{{ u.role }}</span></td><td><span class="status-dot {{ 'active' if u.is_active else 'off' }}">{{ 'Active' if u.is_active else 'Disabled' }}</span></td><td>{{ u.created_at.strftime('%d %b %Y') if u.created_at else '-' }}</td><td>{{ u.last_login_at.strftime('%d %b, %H:%M') if u.last_login_at else 'Never' }}</td><td class="text-end"><div class="admin-actions"><form method="POST" action="{{ url_for('admin_toggle_user', user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-light" {% if u.email == session.get('user',{}).get('email') %}disabled{% endif %}>{{ 'Disable' if u.is_active else 'Enable' }}</button></form><form method="POST" action="{{ url_for('admin_change_role', user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="role" value="{{ 'Student' if u.role == 'Admin' else 'Admin' }}"><button class="btn btn-sm btn-primary" {% if u.email == session.get('user',{}).get('email') %}disabled{% endif %}>Make {{ 'Student' if u.role == 'Admin' else 'Admin' }}</button></form></div></td></tr>{% else %}<tr><td colspan="6" class="text-center text-muted py-5">No users yet.</td></tr>{% endfor %}</tbody></table></div></div>
<script>document.addEventListener('DOMContentLoaded',()=>{const rows={{ stats.daily|tojson }};new Chart(document.getElementById('trafficChart'),{type:'line',data:{labels:rows.map(r=>r.traffic_date),datasets:[{label:'Requests',data:rows.map(r=>r.requests),tension:.35,fill:true},{label:'Unique visitors',data:rows.map(r=>r.unique_visitors),tension:.35}]},options:{responsive:true,plugins:{legend:{labels:{color:'#aeb8d4'}}},scales:{x:{ticks:{color:'#8f9ab7'},grid:{color:'rgba(255,255,255,.05)'}},y:{beginAtZero:true,ticks:{color:'#8f9ab7'},grid:{color:'rgba(255,255,255,.05)'}}}}});});</script>
{% endblock %}
'''
          Path('templates/admin.html').write_text(admin_html, encoding='utf-8')

          admin_css = r'''.admin-hero{padding:28px 30px;display:flex;justify-content:space-between;gap:20px;align-items:center}.admin-hero h1{font-weight:800;margin:5px 0}.admin-hero p{margin:0;color:var(--text-muted)}.admin-live{padding:9px 14px;border:1px solid rgba(73,220,170,.28);border-radius:999px;background:rgba(73,220,170,.08);font-weight:700}.admin-live span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#49dcaa;margin-right:8px;box-shadow:0 0 14px #49dcaa}.admin-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.admin-kpi{padding:20px}.admin-kpi small{display:block;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.admin-kpi strong{display:block;font-size:2rem;margin:5px 0}.admin-kpi span{color:var(--text-muted)}.admin-card{padding:24px}.admin-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.admin-card-head small{color:#8f9cff;font-weight:800;letter-spacing:.1em}.admin-card-head h3{margin:3px 0 0;font-weight:800}.admin-pages{display:grid;gap:10px}.admin-pages>div{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.035)}.admin-pages span{overflow:hidden;text-overflow:ellipsis}.admin-pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:rgba(130,118,255,.12);border:1px solid rgba(130,118,255,.25);font-weight:700}.admin-table{--bs-table-bg:transparent;--bs-table-color:inherit}.admin-table td,.admin-table th{border-color:rgba(255,255,255,.08);padding:14px 10px}.admin-table td:first-child small{display:block;color:var(--text-muted);margin-top:3px}.status-dot{display:inline-flex;align-items:center;gap:7px}.status-dot:before{content:'';width:8px;height:8px;border-radius:50%;background:#49dcaa}.status-dot.off:before{background:#ff718b}.admin-actions{display:flex;justify-content:flex-end;gap:8px}.admin-actions form{margin:0}@media(max-width:1100px){.admin-kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.admin-hero{align-items:flex-start;flex-direction:column}.admin-kpis{grid-template-columns:1fr}.admin-actions{flex-direction:column}}
'''
          Path('static/css/admin.css').write_text(admin_css, encoding='utf-8')

          app = Path('app.py').read_text(encoding='utf-8')
          def repl(old,new):
              global app
              if old not in app:
                  raise SystemExit('Patch anchor not found: '+old[:80])
              app = app.replace(old,new,1)

          repl('import json\n', 'import hashlib\nimport json\n')
          repl('from werkzeug.security import check_password_hash, generate_password_hash\n', 'from werkzeug.middleware.proxy_fix import ProxyFix\nfrom werkzeug.security import check_password_hash, generate_password_hash\n')
          repl('from prediction.report_generator import ReportGenerator\n', '''from prediction.report_generator import ReportGenerator\nfrom db_store import (\n    admin_snapshot, create_user as db_create_user, db_enabled, ensure_admin, fetch_history,\n    fetch_users, increment_metric, record_request, save_history, set_user_active,\n    set_user_role, touch_login,\n)\n''')
          repl('    WTF_CSRF_TIME_LIMIT=None,\n)', '    WTF_CSRF_TIME_LIMIT=None,\n    WTF_CSRF_SSL_STRICT=False,\n)\napp.wsgi_app = ProxyFix(app.wsgi_app, x_for=1, x_proto=1, x_host=1)')
          repl('''def init_runtime_state():\n    if not USERS_FILE.exists():\n        _atomic_json_write(USERS_FILE, [])\n    if not HISTORY_FILE.exists():\n        _atomic_json_write(HISTORY_FILE, [])\n    admin_email = os.environ.get("INITIAL_ADMIN_EMAIL", "").strip().lower()\n    admin_password = os.environ.get("INITIAL_ADMIN_PASSWORD", "")\n    admin_name = os.environ.get("INITIAL_ADMIN_NAME", "Project Admin").strip() or "Project Admin"\n    if admin_email and admin_password:\n        with _json_lock:\n            users = _load_json(USERS_FILE, [])\n            if not any(u.get("email", "").lower() == admin_email for u in users):\n                users.append({"email": admin_email, "name": admin_name, "password": generate_password_hash(admin_password), "role": "Admin"})\n                _atomic_json_write(USERS_FILE, users)\n''', '''def init_runtime_state():\n    if not USERS_FILE.exists():\n        _atomic_json_write(USERS_FILE, [])\n    if not HISTORY_FILE.exists():\n        _atomic_json_write(HISTORY_FILE, [])\n    admin_email = os.environ.get("INITIAL_ADMIN_EMAIL", "").strip().lower()\n    admin_password = os.environ.get("INITIAL_ADMIN_PASSWORD", "")\n    admin_name = os.environ.get("INITIAL_ADMIN_NAME", "Project Admin").strip() or "Project Admin"\n    if db_enabled():\n        if admin_email and admin_password:\n            ensure_admin(admin_email, generate_password_hash(admin_password), admin_name)\n        return\n    if admin_email and admin_password:\n        with _json_lock:\n            users = _load_json(USERS_FILE, [])\n            if not any(u.get("email", "").lower() == admin_email for u in users):\n                users.append({"email": admin_email, "name": admin_name, "password": generate_password_hash(admin_password), "role": "Admin", "is_active": True})\n                _atomic_json_write(USERS_FILE, users)\n''')
          repl('''def load_users():\n    return _load_json(USERS_FILE, [])\n\n\ndef save_user(user_data):\n    with _json_lock:\n        users = load_users()\n        users.append(user_data)\n        _atomic_json_write(USERS_FILE, users)\n''', '''def load_users():\n    if db_enabled():\n        return fetch_users()\n    return _load_json(USERS_FILE, [])\n\n\ndef save_user(user_data):\n    if db_enabled():\n        return db_create_user(user_data["name"], user_data["email"], user_data["password"], user_data.get("role", "Student"))\n    with _json_lock:\n        users = load_users()\n        user_data.setdefault("is_active", True)\n        users.append(user_data)\n        _atomic_json_write(USERS_FILE, users)\n''')
          repl('''def load_history():\n    return _load_json(HISTORY_FILE, [])\n''', '''def load_history():\n    if db_enabled():\n        user = session.get("user", {})\n        return fetch_history(user.get("email"), user.get("role") == "Admin")\n    return _load_json(HISTORY_FILE, [])\n''')
          repl('''    with _json_lock:\n        history = load_history()\n        next_id = max([int(item.get("id", 0)) for item in history] or [0]) + 1\n        history.append({\n            "id": next_id,\n            "date": datetime.now().isoformat(timespec="seconds"),\n            "student_name": student_data.get("Name") or student_data.get("Student_Name") or "Student",\n            "student": student_data,\n            "prediction": prediction,\n            "prediction_label": label,\n            "confidence": confidence,\n            "report": report_name,\n            "user_email": user.get("email", ""),\n        })\n        _atomic_json_write(HISTORY_FILE, history)\n''', '''    if db_enabled():\n        save_history(student_data, prediction, label, confidence, report_name, user.get("email", ""))\n        increment_metric("predictions")\n        return\n    with _json_lock:\n        history = load_history()\n        next_id = max([int(item.get("id", 0)) for item in history] or [0]) + 1\n        history.append({\n            "id": next_id,\n            "date": datetime.now().isoformat(timespec="seconds"),\n            "student_name": student_data.get("Name") or student_data.get("Student_Name") or "Student",\n            "student": student_data,\n            "prediction": prediction,\n            "prediction_label": label,\n            "confidence": confidence,\n            "report": report_name,\n            "user_email": user.get("email", ""),\n        })\n        _atomic_json_write(HISTORY_FILE, history)\n''')
          repl('''        if not user_match or not verify_user_password(user_match.get("password"), password):\n            flash("Invalid email or password.", "danger")\n            return redirect(url_for("login"))\n''', '''        if not user_match or not verify_user_password(user_match.get("password"), password):\n            flash("Invalid email or password.", "danger")\n            return redirect(url_for("login"))\n        if user_match.get("is_active") is False:\n            flash("This account has been disabled by an administrator.", "danger")\n            return redirect(url_for("login"))\n''')
          repl('''        session["user"] = {"name": user_match.get("name", "User"), "email": user_match.get("email", email), "role": user_match.get("role", "Student")}\n        flash(f"Welcome back, {session['user']['name']}!", "success")\n''', '''        session["user"] = {"name": user_match.get("name", "User"), "email": user_match.get("email", email), "role": user_match.get("role", "Student")}\n        if db_enabled():\n            touch_login(email)\n            increment_metric("logins")\n        flash(f"Welcome back, {session['user']['name']}!", "success")\n''')
          repl('''        save_user({"name": name, "email": email, "password": generate_password_hash(password), "role": role})\n        session.clear()\n''', '''        save_user({"name": name, "email": email, "password": generate_password_hash(password), "role": role})\n        if db_enabled():\n            increment_metric("registrations")\n        session.clear()\n''')
          anchor = '''def allowed_dataset(filename):\n'''
          tracking = '''@app.before_request\ndef track_request():\n    if not db_enabled() or request.path.startswith("/static/"):\n        return\n    try:\n        visitor = session.get("_visitor_id")\n        if not visitor:\n            visitor = secrets.token_hex(16)\n            session["_visitor_id"] = visitor\n        digest = hashlib.sha256((visitor + app.config["SECRET_KEY"]).encode()).hexdigest()\n        record_request(request.path, digest, "user" in session)\n    except Exception as exc:\n        print("Traffic tracking warning:", exc)\n\n\n'''
          repl(anchor, tracking + anchor)
          admin_routes = '''\n\n@app.route("/admin")\n@admin_required\ndef admin_console():\n    if not db_enabled():\n        flash("Admin analytics requires DATABASE_URL / Neon.", "warning")\n        return redirect(url_for("dashboard"))\n    return render_template("admin.html", users=fetch_users(), stats=admin_snapshot())\n\n\n@app.route("/admin/users/<int:user_id>/toggle", methods=["POST"])\n@admin_required\ndef admin_toggle_user(user_id):\n    users = fetch_users() if db_enabled() else []\n    target = next((u for u in users if int(u.get("id", 0)) == user_id), None)\n    if not target:\n        flash("User not found.", "danger")\n    elif target.get("email") == session.get("user", {}).get("email"):\n        flash("You cannot disable your own administrator account.", "warning")\n    else:\n        set_user_active(user_id, not bool(target.get("is_active")))\n        flash("User status updated.", "success")\n    return redirect(url_for("admin_console"))\n\n\n@app.route("/admin/users/<int:user_id>/role", methods=["POST"])\n@admin_required\ndef admin_change_role(user_id):\n    role = request.form.get("role", "Student")\n    users = fetch_users() if db_enabled() else []\n    target = next((u for u in users if int(u.get("id", 0)) == user_id), None)\n    if not target:\n        flash("User not found.", "danger")\n    elif target.get("email") == session.get("user", {}).get("email"):\n        flash("You cannot change your own administrator role here.", "warning")\n    elif role not in {"Admin", "Student"}:\n        flash("Invalid role.", "danger")\n    else:\n        set_user_role(user_id, role)\n        flash(f"{target.get('name','User')} is now {role}.", "success")\n    return redirect(url_for("admin_console"))\n'''
          repl('\n\n@app.errorhandler(413)\n', admin_routes + '\n\n@app.errorhandler(413)\n')
          Path('app.py').write_text(app, encoding='utf-8')

          base = Path('templates/base.html').read_text(encoding='utf-8')
          old = '''      <a href="{{ url_for('report') }}" class="{% if request.endpoint in ['report','download_saved_report'] %}active{% endif %}"><i class="fa-solid fa-file-pdf"></i><span>Reports</span></a>\n'''
          new = old + '''      {% if session.get('user', {}).get('role') == 'Admin' %}<div class="nav-heading">Administration</div><a href="{{ url_for('admin_console') }}" class="{% if request.endpoint and request.endpoint.startswith('admin_') %}active{% endif %}"><i class="fa-solid fa-shield-halved"></i><span>Admin Console</span></a>{% endif %}\n'''
          if old not in base: raise SystemExit('Base nav anchor missing')
          Path('templates/base.html').write_text(base.replace(old,new,1), encoding='utf-8')

          req = Path('requirements.txt').read_text(encoding='utf-8')
          if 'psycopg[' not in req:
              req = req.rstrip() + '\npsycopg[binary]==3.2.3\n'
          Path('requirements.txt').write_text(req, encoding='utf-8')
          PY
