name: Apply Neon Admin Migration
on:
  push:
    branches:
      - feat/neon-admin-console
    paths:
      - .github/workflows/apply-neon-admin.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/neon-admin-console
      - name: Apply patch
        run: python scripts/apply_neon_patch.py
      - name: Validate
        run: |
          python -m py_compile app.py db_store.py
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader('templates'))
          for name in ['base.html','admin.html','login.html','register.html']:
              env.get_template(name)
          print('templates OK')
          PY
      - name: Commit changes
        run: |
          git config user.name "void-tech-shiv"
          git config user.email "actions@users.noreply.github.com"
          git add app.py requirements.txt templates/base.html
          git commit -m "feat: connect Neon and add admin controls"
          git push origin feat/neon-admin-console
